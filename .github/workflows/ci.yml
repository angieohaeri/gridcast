name: CI

on:
  push:
    branches: [main, lmp-pricing-model]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --extra dev

      - run: uv run make lint

      - run: uv run make test
