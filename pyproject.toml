[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bikeshare"
version = "0.0.1"
description = "Bike availability fpredictorr for Divvy bikeshare system in Chicago."
authors = [
  { name = "Angie Ohaeri" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.13.0"


[tool.ruff]
line-length = 99
src = ["bikeshare"]
include = ["pyproject.toml", "bikeshare/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["bikeshare"]
force-sort-within-sections = true

