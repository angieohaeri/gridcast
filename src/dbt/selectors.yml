# ERD Studio manages selectors prefixed with `domain_` whose description ends with "Managed by ERD Studio." — regenerated automatically.
# Other selectors below are user-managed and preserved across regenerates.

selectors:
  - name: domain_gold_features_load
    description: All models in the features_load domain (gold layer). Managed by ERD Studio.
    definition:
      union:
        - method: fqn
          value: features
        - method: fqn
          value: inst_load_features
        - method: fqn
          value: lmp_features
        - method: fqn
          value: load_features
        - method: fqn
          value: weather_features
  - name: domain_silver_lmp_staging
    description: All models in the lmp_staging domain (silver layer). Managed by ERD Studio.
    definition:
      union:
        - method: fqn
          value: stg_generation_by_fuel
        - method: fqn
          value: stg_generation_ehv_losses
        - method: fqn
          value: stg_marginal_value_da
        - method: fqn
          value: stg_marginal_value_rt
        - method: fqn
          value: stg_scheduled_generation
  - name: domain_silver_staging
    description: All models in the staging domain (silver layer). Managed by ERD Studio.
    definition:
      union:
        - method: fqn
          value: stg_inst_load
        - method: fqn
          value: stg_lmp
        - method: fqn
          value: stg_load
        - method: fqn
          value: stg_weather
  # the original load-forecasting stack: staging views/tables, features, weather zones seed
  - name: load
    definition:
      union:
        - "path:models/staging"
        - "path:models/features"
        - "pjm_weather_zones"

  # LMP model, history side: depends only on verified RT/DA LMPs (lmp_rt syncs at
  # 12:40 ET), so it can run early and carries the slow uniqueness tests
  - name: lmp_history
    definition:
      union:
        - "+spread"
        - "source:raw_lmp.pnode_topology_nodes"

  # every lmp_staging view and its tests, not scheduled: the views no feature model reads yet
  - name: lmp_staging
    definition: "path:models/lmp_staging"

  # LMP model, serving side: needs the afternoon inputs (DA prices 14:05, load forecast
  # 14:15/14:20, weather snapshot 14:25 ET), so it runs after them and before the 14:30 ET cutoff
  - name: lmp_serving
    definition:
      union:
        - "stg_marginal_value_rt"
        - "stg_marginal_value_da"
        - "source:raw_lmp.lmp_da_zonal"
        - "system_features"
        - "load_forecast_areas"
        - "nodes"
        - "load_forecast_features"
        - "zone_features"
        - "baseline_features"
        - "model_features"
