version: 2

seeds:
  - name: pjm_weather_zones
    description: >
      PJM zones in scope, one row per weather station. Seven zones carry 2-3 stations and
      the producer averages them, so zone_id repeats here but `weather` stays one row per
      (time, zone).
    config:
      column_types:
        zone_id: text
        zone_name: text
        city: text
        lat: double precision
        lon: double precision
    columns:
      - name: zone_id
        tests: [not_null]
      - name: city
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [zone_id, city]

  - name: load_forecast_areas
    description: >
      PJM load forecast area covering each zone. load_frcstd_hist has 9 single-zone areas
      plus MIDATL (all eleven mid-Atlantic zones combined) and RTO; the live 7-day feed is
      finer for MIDATL but history is not, so the coarse set is used for train and serve.
    config:
      column_types:
        zone_id: text
        forecast_area: text
    columns:
      - name: zone_id
        tests: [unique, not_null]
      - name: forecast_area
        tests: [not_null]

  - name: tie_line_zones
    description: >
      PJM zone(s) each scheduled-interchange tie line physically lands in, from HIFLD lines
      crossing the PJM border (2026-10-28, see decisions.md). A tie line touching several zones
      has a row per zone. ALTW, CWLP and IPL have no physical tie to PJM and are left out, so
      they count only in the system-wide total.
    config:
      column_types:
        tie_line: text
        zone_id: text
    columns:
      - name: tie_line
        tests: [not_null]
      - name: zone_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pjm_weather_zones')
                field: zone_id
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tie_line, zone_id]
