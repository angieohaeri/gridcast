name: gridcast
version: '1.0.0'
config-version: 2

profile: gridcast

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # |RT - DA| spread ($/MWh) counted as a spike in spread.spike_share_7d
  lmp_spike_threshold: 100

  # every PJM zone except OVEC 
  in_scope_zones: ['AE', 'AEP', 'AP', 'ATSI', 'BC', 'CE', 'DAY', 'DEOK', 'DOM', 'DPL',
                   'DUQ', 'EKPC', 'JC', 'ME', 'PE', 'PEP', 'PL', 'PN', 'PS', 'RECO']

  # LMP pricing model: last complete ET day of each source available at the 14:30 ET
  # forecast cutoff on day D, as an offset from D. Recorded from the DB on 2026-10-24 18:47 ET,
  # before the sync end-date fix (7b66260), so these understate what PJM has: the day-ahead sources and
  # fuel mix lagged because our sync stopped at D-1. Re-check the DB at 14:30 ET before relying on them.
  feature_availability_days:
    rt_lmp_verified: -2
    da_lmp: 1
    marginal_value_rt: -1
    marginal_value_da: 1
    transmission_constraints_da: -1
    lmp_da_zonal: -1
    generation_by_fuel: -1
    scheduled_generation: -2
    generation_ehv_losses: -1
    forecasted_generation_outages: 0
  # monthly sources, by the month of the cutoff day: EIA gas cost for month M is used from the
  # start of month M + lag (on 2026-10-28 the latest was 2026-08); operator-initiated commitments
  # for month M post on this day of month M+1 (on 2026-10-28 the latest event was 2026-09-30)
  natural_gas_fuel_cost_lag_months: 3
  commitments_posting_day: 20
  # states PJM serves, for the EIA gas cost average (states EIA leaves blank drop out)
  pjm_states: ['DC', 'DE', 'IL', 'IN', 'KY', 'MD', 'MI', 'NC', 'NJ', 'OH', 'PA', 'TN', 'VA', 'WV']
  rt_unverified_last_hour_ending_et: 14
  # time of day (ET, on the day before the target day) the daily forecast is issued
  forecast_cutoff_et: '14 hours 30 minutes'

seeds:
  gridcast:
    load_forecast_areas:
      +schema: lmp

models:
  gridcast:
    staging:
      +materialized: view
    features:
      +materialized: table
    lmp_staging:
      # views over raw_lmp, lands in `analytics_lmp` alongside lmp_features
      +schema: lmp
      +materialized: view
    lmp_features:
      # isolated from the load model's `analytics.features` - lands in `analytics_lmp`
      # (dbt's default schema-naming, <target_schema>_<custom>, no override macro exists)
      +schema: lmp
      +materialized: table
