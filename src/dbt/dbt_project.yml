name: gridcast
version: '1.0.0'
config-version: 2

profile: gridcast

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # every PJM zone except OVEC 
  in_scope_zones: ['AE', 'AEP', 'AP', 'ATSI', 'BC', 'CE', 'DAY', 'DEOK', 'DOM', 'DPL',
                   'DUQ', 'EKPC', 'JC', 'ME', 'PE', 'PEP', 'PL', 'PN', 'PS', 'RECO']

models:
  gridcast:
    staging:
      +materialized: view
    features:
      +materialized: table
    lmp_features:
      # isolated from the load model's `analytics.features` - lands in `analytics_lmp`
      # (dbt's default schema-naming, <target_schema>_<custom>, no override macro exists)
      +schema: lmp
      +materialized: table
