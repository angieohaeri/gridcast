name: gridcast
version: '1.0.0'
config-version: 2

profile: gridcast

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # every PJM zone except OVEC, which averages 54 MW and appears in PJM's load feed but
  # not EIA's subregion list. RTO is the whole-footprint total, a different grain, and is
  # deliberately not modelled as a zone.
  in_scope_zones: ['AE', 'AEP', 'AP', 'ATSI', 'BC', 'CE', 'DAY', 'DEOK', 'DOM', 'DPL',
                   'DUQ', 'EKPC', 'JC', 'ME', 'PE', 'PEP', 'PL', 'PN', 'PS', 'RECO']

models:
  gridcast:
    staging:
      +materialized: view
    features:
      +materialized: table
