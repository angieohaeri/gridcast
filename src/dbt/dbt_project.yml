name: gridcast
version: '1.0.0'
config-version: 2

profile: gridcast

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # every PJM zone except OVEC (54 MW avg, absent from EIA's subba list). RTO is the
  # footprint total - different grain, not modelled.
  in_scope_zones: ['AE', 'AEP', 'AP', 'ATSI', 'BC', 'CE', 'DAY', 'DEOK', 'DOM', 'DPL',
                   'DUQ', 'EKPC', 'JC', 'ME', 'PE', 'PEP', 'PL', 'PN', 'PS', 'RECO']

models:
  gridcast:
    staging:
      +materialized: view
    features:
      +materialized: table
