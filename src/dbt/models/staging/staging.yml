version: 2

models:
  - name: stg_load
    description: "Cleaned load rows. Grain: one row per (time, zone, source)."
    columns:
      - name: time
        tests: [not_null]
      - name: zone
        tests:
          - not_null
          - accepted_values:
              # stg_load is unfiltered, so this covers every zone the producers emit:
              # the 20 in scope plus RTO, PJM's whole-footprint total.
              values: ['AE', 'AEP', 'AP', 'ATSI', 'BC', 'CE', 'DAY', 'DEOK', 'DOM', 'DPL',
                       'DUQ', 'EKPC', 'JC', 'ME', 'PE', 'PEP', 'PL', 'PN', 'PS', 'RECO', 'RTO']
      - name: source
        tests:
          - not_null
          - accepted_values: {values: ['pjm', 'eia']}
      - name: demand_mw
        tests: [not_null]

  - name: stg_lmp
    description: "Cleaned LMP rows, in-scope zones only. Grain: one row per (time, pnode_id)."
    columns:
      - name: time
        tests: [not_null]
      - name: zone
        tests:
          - not_null
          - relationships:
              to: ref('pjm_weather_zones')
              field: zone_id
      - name: lmp_total
        tests: [not_null]

  - name: stg_weather
    description: Cleaned weather observations at native sub-hourly grain.
    columns:
      - name: time
        tests: [not_null]
      - name: zone
        tests:
          - not_null
          - relationships:
              to: ref('pjm_weather_zones')
              field: zone_id
      - name: temperature
        tests: [not_null]
