version: 2

models:
  - name: spread
    description: >
      Per-pnode RT-DA spread target plus its trailing 7-day stats as of each hour. Grain: one
      row per (time, pnode_id). Verified RT only. baseline_features reads the stats at the last
      verified day's hour.
    columns:
      - name: rt_lmp
        tests:
          - not_null:
              config:
                where: "time >= now() - interval '10 days'"
      - name: da_lmp
        tests:
          - not_null:
              config:
                where: "time >= now() - interval '10 days'"
      - name: spread
        tests:
          - not_null:
              config:
                where: "time >= now() - interval '10 days'"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [time, pnode_id]
          config:
            where: "time >= now() - interval '10 days'"

  - name: baseline_features
    description: >
      Baseline feature row per (time, pnode_id) for the next-day spread model. DA-spined, so
      spread is null for hours not yet verified (the rows being forecast).
      spread_last_verified_day is also the second baseline to beat.
    columns:
      - name: da_lmp
        tests:
          - not_null:
              config:
                where: "time >= now() - interval '10 days'"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [time, pnode_id]
          config:
            where: "time >= now() - interval '10 days'"

  - name: model_features
    description: >
      View over baseline_features with each node's area load forecast, zone features and system
      features joined on. Grain: one row per (time, pnode_id). Zone columns are null for
      zoneless nodes (hubs, interfaces, PJM-RTO, OVEC).

  - name: system_features
    description: >
      System-wide state per target hour as of the cutoff, the same for every node. Grain: one row
      per time. Shadow prices (da_* the target hour's day-ahead constraints, rt_* the last
      available day's hour and a trailing 7-day mean), day-ahead binding constraints, fuel mix,
      self-scheduled generation and loss ratio at the last available day's hour, the outage
      forecast for the target day, and the EIA gas cost averaged over PJM states. Null where a
      feed has not loaded that day yet.
    columns:
      - name: time
        tests: [unique, not_null]
      - name: rt_constraint_count_prev_day
        tests:
          - not_null:
              config:
                where: "time >= now() - interval '60 days' and time <= now() + interval '1 day'"
      - name: rt_shadow_total_mean_7d
        tests:
          - not_null:
              config:
                where: "time >= now() - interval '60 days' and time <= now() + interval '1 day'"
      - name: gas_share_prev_day
        tests:
          - not_null:
              config:
                where: "time >= now() - interval '60 days' and time <= now() + interval '1 day'"
      - name: gas_cost_per_mmbtu
        tests:
          - not_null:
              config:
                where: "time >= now() - interval '60 days' and time <= now() + interval '1 day'"

  - name: load_forecast_features
    description: >
      Latest PJM load forecast issued by the cutoff, per target hour and forecast area.
      Grain: one row per (time, forecast_area).
    columns:
      - name: forecast_load_mw
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [time, forecast_area]

  - name: nodes
    description: >
      GNN node set with every per-node attribute the model reads. Grain: one row per pnode_id.
      zone_id is the weather and commitments zone; forecast_area the load forecast area.
    columns:
      - name: pnode_id
        tests: [unique, not_null]
      - name: forecast_area
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [AEP, APS, ATSI, COMED, DAY, DEOK, DOM, DUQ, EKPC, MIDATL, RTO]

  - name: zone_features
    description: >
      Per target hour and zone as of the cutoff. Grain: one row per (time, zone). Weather: the
      live snapshot when one was taken before the cutoff, else the previous_day1 forecast.
      Commitments: operator-initiated commitments in the zone over the latest month posted by the
      cutoff, overall and for Constraint Management; null for months not loaded yet.
    columns:
      - name: temperature
        tests: [not_null]
      - name: commitment_count
        tests:
          - not_null:
              config:
                where: "time >= now() - interval '60 days' and time <= now() + interval '1 day'"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [time, zone]
