services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: gridcast-timescaledb
    restart: unless-stopped
    # Postgres parallel workers hash-join in /dev/shm, which Docker defaults to 64MB. At
    # 20 zones the `features` join blows past it: "could not resize shared memory segment".
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${TIMESCALEDB_DB}
      POSTGRES_USER: ${TIMESCALEDB_USER}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD}
    ports:
      - "${TIMESCALEDB_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./src/consumers/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALEDB_USER} -d ${TIMESCALEDB_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-net

  mlflow:
    build: .
    image: gridcast:latest
    container_name: gridcast-mlflow
    restart: unless-stopped
    # Backend store (run/metric/param metadata) is the `mlflow` db on the shared
    # timescaledb instance; artifact store (logged models) is a plain volume - no
    # need for S3/GCS-style object storage at this scale.
    # --workers 1: default is 4, one is plenty at this scale (~4GB RAM shared across
    # ~10 containers, same constraint as KAFKA_HEAP_OPTS below) - NOTE: ruled out as
    # the cause of the startup hang below (still hung with 1 worker), kept anyway
    # since it's still the right call resource-wise.
    #
    # Startup used to take minutes (looked like a deadlock, wasn't one) - py-spy
    # caught the main thread mid-`import pandas`, stuck in the .pyc bytecode-cache
    # step. Every container recreate lost the previous container's compiled bytecode
    # (writable layer, not persisted), forcing a from-scratch recompile of pandas +
    # mlflow's many submodules under this host's disk I/O contention from ~10 other
    # containers. Real fix is in the Dockerfile (--compile-bytecode, bakes .pyc into
    # the image layer instead) - see references/decisions.md for the full timeline.
    #
    # Second, separate hang found 2026-08-20 (py-spy again): mlflow's telemetry
    # thread does a blocking requests.get() to an external config endpoint during
    # startup, and urllib3's hface backend lazily imports a submodule mid-connect -
    # while holding Python's import lock. If that network call can't complete (e.g.
    # this host's route out was still settling right after a reboot), the main
    # thread deadlocks waiting on the same import lock to finish unrelated imports.
    # MLFLOW_DISABLE_TELEMETRY below removes the network call entirely - also just
    # correct for a self-hosted instance with no reason to phone home.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --backend-store-uri postgresql://${TIMESCALEDB_USER}:${TIMESCALEDB_PASSWORD}@timescaledb:5432/mlflow
      --default-artifact-root /app/mlflow-artifacts
      --allowed-hosts "*"
      --cors-allowed-origins "*"
    env_file: .env
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
    ports:
      - "5000:5000"
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/app/mlflow-artifacts
    healthcheck:
      # BEST OPTION: Pure TCP socket check. It ignores HTTP/Host headers entirely.
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 5000))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - kafka-net

  kafka:
    image: apache/kafka:latest
    container_name: kafka-kraft
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'

      # This host has 4GB total RAM shared across ~10 containers - cap the JVM
      # heap explicitly rather than trust the image's default sizing heuristic,
      # which assumes more headroom than this box has.
      KAFKA_HEAP_OPTS: '-Xmx512m -Xms256m'

      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,INTERNAL://0.0.0.0:9095,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,EXTERNAL://${KAFKA_TAILSCALE_HOST}:9094,INTERNAL://kafka-kraft:9095'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'

      # Map listener names to security protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      
      # Required cluster ID for KRaft mode
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      
      # Topic creation defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - kafka-net

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      - kafka
    networks:
      - kafka-net
    entrypoint: []
    command:
      - /bin/bash
      - -c
      - |
        until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-kraft:9095 > /dev/null 2>&1; do
          echo waiting for kafka-kraft:9095...; sleep 2;
        done
        for topic in load lmp weather load_dlq lmp_dlq weather_dlq; do
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka-kraft:9095 --topic $$topic --partitions 1 --replication-factor 1
        done

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - kafka-net
    depends_on:
      - kafka-init
    environment:
      # Enable adjustments (like creating topics) via the browser
      DYNAMIC_CONFIG_ENABLED: 'true'
      # Link the UI to your KRaft cluster using the internal listener
      KAFKA_CLUSTERS_0_NAME: 'local-kraft-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka-kraft:9095'

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: gridcast-prefect-server
    restart: unless-stopped
    entrypoint: ["prefect", "server", "start"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      # Postgres, not SQLite - moved off SQLite because concurrent writes from
      # background services (automation bucket cleanup, telemetry) collided with
      # deployment registration and caused "database is locked" crashes. Uses its
      # own `prefect` database on the existing timescaledb instance, not the
      # gridcast hypertables. Needs the `+asyncpg` scheme specifically - Prefect's
      # server uses SQLAlchemy's async engine, and psycopg2 (sync-only) isn't
      # even installed in the prefecthq/prefect image.
      PREFECT_SERVER_API_HOST: '0.0.0.0'
      PREFECT_SERVER_API_PORT: '4200'
      PREFECT_API_DATABASE_CONNECTION_URL: 'postgresql+asyncpg://${TIMESCALEDB_USER}:${TIMESCALEDB_PASSWORD}@timescaledb:5432/prefect'
      # Controls what the *served dashboard's JS* calls back to - not the same as
      # PREFECT_API_URL (that's the client-side setting, for a CLI/worker/flow
      # connecting to this server, and belongs in .env, not here). Must be the
      # Tailscale hostname, not 127.0.0.1/localhost - a browser on the laptop
      # resolves "localhost" to itself, not the Mac Mini.
      PREFECT_UI_API_URL: 'http://${KAFKA_TAILSCALE_HOST}:4200/api'
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-net

  load-producer:
    build: .
    image: gridcast:latest
    container_name: gridcast-load-producer
    restart: "no"
    command: python src/producers/load_producer.py
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-kraft:9095
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net
    volumes:
      - ./data/processed/pjm_weather_zones.csv:/app/data/processed/pjm_weather_zones.csv:ro

  lmp-producer:
    build: .
    image: gridcast:latest
    container_name: gridcast-lmp-producer
    restart: "no"
    command: python src/producers/lmp_producer.py
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-kraft:9095
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net
    volumes:
      - ./data/processed/pjm_weather_zones.csv:/app/data/processed/pjm_weather_zones.csv:ro

  weather-producer:
    build: .
    image: gridcast:latest
    container_name: gridcast-weather-producer
    restart: "no"
    command: python src/producers/weather_producer.py
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-kraft:9095
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net
    volumes:
      - ./data/processed/pjm_weather_zones.csv:/app/data/processed/pjm_weather_zones.csv:ro

  load-consumer:
    build: .
    image: gridcast:latest
    container_name: gridcast-load-consumer
    restart: "no"
    command: python src/consumers/load_consumer.py
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-kraft:9095
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    networks:
      - kafka-net

  lmp-consumer:
    build: .
    image: gridcast:latest
    container_name: gridcast-lmp-consumer
    restart: "no"
    command: python src/consumers/lmp_consumer.py
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-kraft:9095
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    networks:
      - kafka-net

  weather-consumer:
    build: .
    image: gridcast:latest
    container_name: gridcast-weather-consumer
    restart: "no"
    command: python src/consumers/weather_consumer.py
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-kraft:9095
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    networks:
      - kafka-net

  prefect-deployments:
    build: .
    image: gridcast:latest
    container_name: gridcast-prefect-deployments
    restart: unless-stopped
    command: python src/prefect/deployments.py
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-kraft:9095
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      PREFECT_API_URL: http://prefect-server:4200/api
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_URL: http://api:8000
      DASHBOARD_URL: http://dashboard:8080
      # see the mlflow service's comment - the client library can hit the same
      # telemetry-thread startup deadlock, not just `mlflow server` itself
      MLFLOW_DISABLE_TELEMETRY: "true"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks:
      - kafka-net
    volumes:
      - ./data/processed/pjm_weather_zones.csv:/app/data/processed/pjm_weather_zones.csv:ro
      - mlflow_artifacts:/app/mlflow-artifacts
      # db_backup deployment is disabled for now (see deployments.py) until
      # RCLONE_REMOTE/rclone config are set up - re-enable alongside it
      # - backup_data:/app/backups
      # - ${HOME}/.config/rclone:/root/.config/rclone:ro

  api:
    build: .
    image: gridcast:latest
    container_name: gridcast-api
    restart: unless-stopped
    command: python src/api/main.py
    env_file: .env
    environment:
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: "5432"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      PREFECT_API_URL: http://prefect-server:4200/api
      # see the mlflow service's comment - the client library can hit the same
      # telemetry-thread startup deadlock, not just `mlflow server` itself
      MLFLOW_DISABLE_TELEMETRY: "true"
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    networks:
      - kafka-net
    volumes:
      - mlflow_artifacts:/app/mlflow-artifacts

  dashboard:
    build: .
    image: gridcast:latest
    container_name: gridcast-dashboard
    restart: unless-stopped
    # container-internal hostname, not localhost:8000 (API_URL default in app.py) -
    # same host-vs-container split as TIMESCALEDB_HOST/KAFKA_BOOTSTRAP_SERVERS above
    command: shiny run --host 0.0.0.0 --port 8080 src/dashboard/app.py
    env_file: .env
    environment:
      API_URL: http://api:8000
    ports:
      # host 8081, not 8080 - kafka-ui already claims 8080:8080 above; container-side
      # stays 8080 to match the shiny run --port arg and the Makefile's local `app` target
      - "8081:8080"
    depends_on:
      - api
    networks:
      - kafka-net
    volumes:
      - ./data/external/pjm_zones.geojson:/app/data/external/pjm_zones.geojson:ro
      - ./data/processed/pjm_eia930_subregions.csv:/app/data/processed/pjm_eia930_subregions.csv:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - dashboard
      - api
    # Public routes (dashboard, and api if it's exposed as its own hostname) are
    # configured on the Cloudflare side against these two container names/ports -
    # same flat network as everything else, no separate tunnel-only network.
    networks:
      - kafka-net


networks:
  kafka-net:

volumes:
  timescaledb_data:
  kafka_data:
  prefect_data:
  backup_data:  # unused while db_backup is disabled (see prefect-deployments/deployments.py)
  mlflow_artifacts:
